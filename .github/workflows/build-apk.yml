
name: Build Original CubClone APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare signing key
        shell: pwsh
        run: |
          $key = "$env:GITHUB_WORKSPACE/cubclone-ci.jks"
          keytool -genkeypair -v `
            -keystore $key `
            -alias cubclone `
            -keyalg RSA `
            -keysize 2048 `
            -validity 10000 `
            -storepass cubclone123 `
            -keypass cubclone123 `
            -dname "CN=CubClone CI"

          @"
          storeFile=$key
          storePassword=cubclone123
          keyAlias=cubclone
          keyPassword=cubclone123
          "@ | Set-Content signing.properties

          "CUBCLONE_SIGNING=$env:GITHUB_WORKSPACE/signing.properties" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "PYTHON=python" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build helper
        shell: bash
        run: bash proto/build.sh

      - name: Build APK
        shell: bash
        run: bash app/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubClone-APK
          path: app/分身空间.apk
          if-no-files-found: error
