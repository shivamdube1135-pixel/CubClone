
name: Build Original CubClone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare Python
        shell: pwsh
        run: |
          "PYTHON=python" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Helper
        shell: bash
        run: bash proto/build.sh

      - name: Build APK
        shell: bash
        run: bash app/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubClone-APK
          path: app/分身空间.apk
          if-no-files-found: error
